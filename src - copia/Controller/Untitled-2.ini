\"color:rgb(17,58,99)\">Sebastian Aragón Zubieta</span></p></span><table cellspacing=\"0\" cellpadding=\"0\" border=\"0\" width=\"100%\" style=\"width:100%\">\r\n            <tbody><tr style=\"border:0px\">\r\n                <td height=\"10\"></td>\r\n            </tr>\r\n            <tr style=\"border:0px\">\r\n                <td>\r\n                    <span style=\"font-size:12px;color:rgb(112,118,123)\">\r\n                        Powered by\r\n                        <a style=\"text-decoration:underline;color:rgb(112,118,123)\" href=\"https://www.trengo.com\" target=\"_blank\">\r\n                            Trengo\r\n                        </a>\r\n                    </span>\r\n                </td>\r\n            </tr>\r\n            <tr>\r\n                <td height=\"30\"></td>\r\n            </tr>\r\n        </tbody></table><blockquote style=\"color:rgb(18,58,99);border-left-width:1px;border-left-style:solid;border-left-color:rgb(204,204,204);font-style:normal;margin:0px 0px 0px 8px;padding:0px 0px 0px 5px;font-size:14px;font-family:Verdana\"><p style=\"font-size:14px;line-height:19px;direction:ltr;color:rgb(18,58,99);font-family:Verdana;padding:0px;margin:0px\">On Fri, Feb 21, 2025 4:55 PM, Sebastian Aragón Zubieta wrote:</p><span style=\"font-size:14px;line-height:19px;direction:ltr;color:rgb(18,58,99);font-family:Verdana\"><p><span style=\"color:rgb(17,58,99)\">Estimado(a)</span></p><p><span style=\"color:rgb(17,58,99)\">sistemas bogota laboratorio vejarano</span></p><p><span style=\"color:rgb(17,58,99)\"><br></span></p><p><span style=\"color:rgb(17,58,99)\">Ticket: 828402228</span></p><p><span style=\"color:rgb(17,58,99)\">En atención a su solicitud, la mesa de servicio <strong>SGM</strong> informa que su caso se encuentra en proceso y tiene la siguiente  <strong>actualización</strong>:</span></p><p>Para poder realizar la cotizacion de la creacion de la plantilla, por favor indicarme si esta debe llevar alguna impresion o calculo adicional.</p><p><span style=\"color:rgb(17,58,99)\">Cordialmente, </span></p><p><span style=\"color:rgb(17,58,99)\">Sebastian Aragón Zubieta</span></p></span><blockquote style=\"color:rgb(18,58,99);border-left-width:1px;border-left-style:solid;border-left-color:rgb(204,204,204);font-style:normal;margin:0px 0px 0px 8px;padding:0px 0px 0px 5px;font-size:14px;font-family:Verdana\"><p style=\"font-size:14px;line-height:19px;direction:ltr;color:rgb(18,58,99);font-family:Verdana;padding:0px;margin:0px\">On Fri, Feb 21, 2025 4:39 PM,  wrote:</p><span style=\"font-size:14px;line-height:19px;direction:ltr;color:rgb(18,58,99);font-family:Verdana\"><p><span style=\"color:rgb(18,58,99)\">Estimado sistemas bogota laboratorio vejarano,<br> <br>La mesa de servicio <strong>SGM</strong> confirma la recepción de su solicitud cuyo ticket asignado es el siguiente: 828402228. El caso será analizado y procesado dentro de los tiempos establecidos en los ANS, conocemos la importancia de su requerimiento y trabajarémos para resolverlo.</span></p><table cellpadding=\"6\" cellspacing=\"0\" id=\"m_4434194035302066813m_4157830057361540831m_2449883597611843035isPasted\" style=\"width:76%\" width=\"883\"><tbody><tr><td bgcolor=\"#c0c0c0\" height=\"24\" style=\"background-color:rgb(192,192,192);border:1px solid rgb(0,0,0);padding:0.1cm;width:18.1932%\" width=\"23.91826923076923%\"><p style=\"line-height:108%;text-align:center;margin-bottom:0.21cm;background-color:transparent\"><strong><span style=\"color:rgb(18,58,99)\">PRIORIDAD</span></strong></p></td><td bgcolor=\"#c0c0c0\" style=\"background-color:rgb(192,192,192);border:1px solid rgb(0,0,0);padding:0.1cm;width:44.9102%\" width=\"43.14903846153846%\"><p style=\"line-height:108%;text-align:center;margin-bottom:0.21cm;background-color:transparent\"><span style=\"color:rgb(18,58,99)\"><strong>DESCRIPCIÓN</strong></span></p></td><td bgcolor=\"#c0c0c0\" style=\"background-color:rgb(192,192,192);border:1px solid rgb(0,0,0);padding:0.1cm;width:15.3305%\" width=\"16.9