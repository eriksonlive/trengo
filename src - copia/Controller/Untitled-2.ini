      "id": 3856688688,
      "ticket_id": 828402228,
      "type": "INBOUND",
      "body_type": "TEXT",
      "message": "Buen díaSolo se requieren los ítems anteriormente especificados Quedo atenta a sus comentarios e indicaciones adicionales. Cordialmente:Aviso de ConfidencialidadEste mensaje y sus documentos adjuntos, pueden contener información privilegiada y/o confidencial que está dirigida exclusivamente a su destinatario. Si usted recibe este mensaje y no es el destinatario indicado, por favor, notifíquelo inmediatamente y remita el mensaje original a la dirección de correo electrónico: calidad@lorenavejarano.com . Cualquier copia, uso o distribución no autorizados de esta comunicación queda estrictamente prohibida.El lun, 24 feb 2025 a la(s) 5:02 p.m., Sebastian | SGM TECNOLOGIA EN INTERNET S.A.S. (soporte@sgm.com.co) escribió:Estimado(a)sistemas bogota laboratorio vejaranoTicket: 828402228En atención a su solicitud, la mesa de servicio SGM informa que su caso se encuentra en proceso y tiene la siguiente  actualización:Seguimos atentos a una respuesta, con el fin de poder continuar con el proceso.Cordialmente, Sebastian Aragón Zubieta\r\n            \r\n                \r\n            \r\n            \r\n                \r\n                    \r\n                        Powered by\r\n                        \r\n                            Trengo\r\n                        \r\n                    \r\n                \r\n            \r\n            \r\n                \r\n            \r\n        On Fri, Feb 21, 2025 4:55 PM, Sebastian Aragón Zubieta wrote:Estimado(a)sistemas bogota laboratorio vejaranoTicket: 828402228En atención a su solicitud, la mesa de servicio SGM informa que su caso se encuentra en proceso y tiene la siguiente  actualización:Para poder realizar la cotizacion de la creacion de la plantilla, por favor indicarme si esta debe llevar alguna impresion o calculo adicional.Cordialmente, Sebastian Aragón ZubietaOn Fri, Feb 21, 2025 4:39 PM,  wrote:Estimado sistemas bogota laboratorio vejarano, La mesa de servicio SGM confirma la recepción de su solicitud cuyo ticket asignado es el siguiente: 828402228. El caso será analizado y procesado dentro de los tiempos establecidos en los ANS, conocemos la importancia de su requerimiento y trabajarémos para resolverlo.PRIORIDADDESCRIPCIÓNTIEMPO DE DIAGNÓSTICOTIEMPO DE SOLUCIÓN(Hrs Hábiles)Alta-La aplicación no funciona, se encuentra deshabilitada o no responde. -Facturación crédito.-Cambio de contraseñas de las cuentas de correo de notificaciones.30 minutos4 horasMediaLa aplicación está funcionando, pero algunos de los componentes menores presentan un funcionamiento anormal.8 horas24 horasBajaLa aplicación presenta anomalías que no impactan el servicio.12 horas48 horasPlaneado / MantenimientoAjustes de reportes ya existentes o modificación de plantillas, capacitaciones o requerimientos nuevos que puedan generar o no control de cambios.24 horasFecha establecida.Agradecemos la atención. Cordial saludo, Mesa de servicio SGM Tecnología en InternetOn Fri, Feb 21, 2025 4:39 PM, sistemasbogota@laboratoriovejarano.com wrote:Buen díaDe manera atenta solicito una plantilla para el examen TEST DE RUFFIER; los ítems a relacionar son P0 ____P1 ____P2 _____RESULTADO ______resultados en campos obligatorios numéricos. Agradezco su gestión, Quedo atenta a sus comentarios e indicaciones adicionales. Cordialmente:Aviso de ConfidencialidadEste mensaje y sus documentos adjuntos, pueden contener información privilegiada y/o confidencial que está dirigida exclusivamente a su destinatario. Si usted recibe este mensaje y no es el destinatario indicado, por favor, notifíquelo inmediatamente y remita el mensaje original a la dirección de correo electrónico: calidad@lorenavejarano.com . Cualquier copia, uso o distribución no autorizados de esta comunicación queda estrictamente prohibida.---------- Forwarded message ---------De: Josefina Pulido Vejarano &lt;gerenteproyectos@laboratoriovejarano.com&gt;Date: vie, 21 feb 2025 a la(s) 11:27 a.m.Subject: Fwd: Hoteles Estelar S.A / Ordenes de servicio - exámenes médicos periódicos / HE Parque de La 93To: creacionclientes laboratorio vejarano &lt;creacionclientes@laboratoriovejarano.com&gt;, sistemas bogota laboratorio vejarano &lt;sistemasbogota@laboratoriovejarano.com&gt;Buenos díasSolicito de manera atenta que en SGM sea creado el siguiente procedimiento TEST DE RUFFIEREl cual debe llevar los siguientes ITEMS, para escribirP0P1P2RESULTADOGracias!!Cordialmente,Aviso de ConfidencialidadEste mensaje y sus documentos adjuntos, pueden contener información privilegiada y/o confidencial que está dirigida exclusivamente a su destinatario. Si usted recibe este mensaje y no es el destinatario indicado, por favor, notifíquelo inmediatamente y remita el mensaje original a la dirección de correo electrónico: calidad@lorenavejarano.com . Cualquier copia, uso o distribución no autorizados de esta comunicación queda estrictamente prohibida.---------- Forwarded message ---------De: Laura Natalia Rodriguez Rozo &lt;lauran.rodriguez@hotelesestelar.com&gt;Date: jue, 20 feb 2025 a la(s) 6:26 p.m.Subject: Hoteles Estelar S.A / Ordenes de servicio - exámenes médicos periódicos / HE Parque de La 93To: gerenteproyectos@laboratoriovejarano.com &lt;gerenteproyectos@laboratoriovejarano.com&gt;Cc: Lesly Mayibe Santamaria Gonzalez &lt;leslym.santamaria@hotelesestelar.com&gt;\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nCordial saludo,\r\nAdjunto la orden de servicio correspondientes al colaborador agendado para los exámenes médicos de periódico programado para el 21 de Febrero de 2025, correspondientes al centro de operación Estelar\r\n Parque de La 93.\r\nQuedo atenta a cualquier comentario o requerimiento adicional, mil gracias\r\nCordialmente,\r\n \r\nLaura Natalia Rodríguez Rozo\r\nAsistente de Gestión Humana\r\nlauran.rodriguez@hotelesestelar.com\r\nHotel ESTELAR Parque de La 93\r\nHotel ESTELAR Calle 100\r\nHOTELES ESTELAR S.A.\r\nTeléfono: 57 + 601 5111555 Ext 2057\r\nVoIPCorp: 88 31 2057\r\nBogotá, Colombia\r\n \r\nRESERVAS al 01 8000 97\r\n 8000