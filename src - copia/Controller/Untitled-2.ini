      "type": "OUTBOUND",
      "body_type": "TEXT",
      "message": " Estimado sistemas bogota laboratorio vejarano,  La mesa de servicio SGM confirma la recepción de su solicitud cuyo ticket asignado es el siguiente: 828402228. El caso será analizado y procesado dentro de los tiempos establecidos en los ANS, conocemos la importancia de su requerimiento y trabajarémos para resolverlo.     PRIORIDAD    DESCRIPCIÓN    TIEMPO DE DIAGNÓSTICO    TIEMPO DE SOLUCIÓN   (Hrs Hábiles)     Alta   -La aplicación no funciona, se encuentra deshabilitada o no responde.   -Facturación crédito.  -Cambio de contraseñas de las cuentas de correo de notificaciones.    30 minutos   4 horas    Media   La aplicación está funcionando, pero algunos de los componentes menores presentan un funcionamiento anormal.   8 horas   24 horas    Baja   La aplicación presenta anomalías que no impactan el servicio.   12 horas   48 horas    Planeado / Mantenimiento   Ajustes de reportes ya existentes o modificación de plantillas, capacitaciones o requerimientos nuevos que puedan generar o no control de cambios.   24 horas   Fecha establecida.     Agradecemos la atención.   Cordial saludo,  Mesa de servicio   SGM Tecnología en Internet ",
