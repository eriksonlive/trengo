onales. Cordialmente:Aviso de ConfidencialidadEste mensaje y sus documentos adjuntos, pueden contener información privilegiada y/o confidencial que está dirigida exclusivamente a su destinatario. Si usted recibe este mensaje y no es el destinatario indicado, por favor, notifíquelo inmediatamente y remita el mensaje original a la dirección de correo electrónico: calidad@lorenavejarano.com . Cualquier copia, uso o distribución no autorizados de esta comunicación queda estrictamente prohibida.---------- Forwarded message ---------De: Josefina Pulido Vejarano &lt;gerenteproyectos@laboratoriovejarano.com&gt;Date: vie, 21 feb 2025 a la(s) 11:27 a.m.Subject: Fwd: Hoteles Estelar S.A / Ordenes de servicio - exámenes médicos periódicos / HE Parque de La 93To: creacionclientes laboratorio vejarano &lt;creacionclientes@laboratoriovejarano.com&gt;, sistemas bogota laboratorio vejarano &lt;sistemasbogota@laboratoriovejarano.com&gt;Buenos díasSolicito de manera atenta que en SGM sea creado el siguiente procedimiento TEST DE RUFFIEREl cual debe llevar los siguientes ITEMS, para escribirP0P1P2RESULTADOGracias!!Cordialmente,Aviso de ConfidencialidadEste mensaje y sus documentos adjuntos, pueden contener información privilegiada y/o confidencial que está dirigida exclusivamente a su destinatario. Si usted recibe este mensaje y no es el destinatario indicado, por favor, notifíquelo inmediatamente y remita el mensaje original a la dirección de correo electrónico: calidad@lorenavejarano.com . Cualquier copia, uso o distribución no autorizados de esta comunicación queda estrictamente prohibida.---------- Forwarded message ---------De: Laura Natalia Rodriguez Rozo &lt;lauran.rodriguez@hotelesestelar.com&gt;Date: jue, 20 feb 2025 a la(s) 6:26 p.m.Subject: Hoteles Estelar S.A / Ordenes de servicio - exámenes médicos periódicos / HE Parque de La 93To: gerenteproyectos@laboratoriovejarano.com &lt;gerenteproyectos@laboratoriovejarano.com&gt;Cc: Lesly Mayibe Santamaria Gonzalez &lt;leslym.santa